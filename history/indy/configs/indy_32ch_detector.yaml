name: indy_32ch_two_layer_compatibility_gate
status: integrated_runtime_candidate_not_prospectively_frozen
decoder: configs/indy_32ch.yaml
literature:
  mindful: https://www.nature.com/articles/s42003-024-06784-4
  manifold_alignment_context: https://www.nature.com/articles/s41551-020-0542-9

data_policy:
  allowed_splits: [train, validation]
  forbidden_split: test
  forbidden_month: 2017-01
  development_sessions: 33
  compatible_reference_sessions: 31
  excluded_development_failures:
    - indy_20160630_01
    - indy_20161013_03
  velocity_labels_loaded: false
  observation_seconds: 60
  observation_bins: 1500

simple_detector:
  channel_profile: log1p_firing_rate_correlation
  robust_rate_distance: median_absolute_channel_z
  global_rate: absolute_log_median_rate_ratio
  dropout: unexpectedly_silent_historically_active_channels
  references: historical_months

mindful_inspired_detector:
  input: fixed_32_raw_counts
  normalization: reference_only_fixed_affine
  dimensions: 5
  projection: reference_only_pca
  distribution: full_covariance_gaussian
  distance: kld_reference_to_current
  references:
    global: one_pooled_pre_january_reference
    multi: one_reference_per_available_historical_month
  note: This is a project-specific simplified MINDFUL baseline, not a paper reproduction.

decoder_state_detector:
  input:
    - frozen_gru_hidden_states
    - frozen_predicted_velocity
  observation_seconds: 60
  hidden_projection:
    method: reference_only_pca
    dimensions: 5
    references: historical_months
  distances:
    hidden_state: symmetric_gaussian_kld
    output_state: symmetric_gaussian_kld
    output_delta: diagnostic_only
    ten_second_hidden_chunks: diagnostic_only
  thresholds:
    warning_quantile: 0.95
    severe_quantile: 0.99
    calibration: nested_leave_one_complete_month_out
  veto:
    rule: hidden_state_severe_and_absolute_output_state_severe
    output_delta_can_veto: false
    temporal_score_can_veto: false
  model_policy:
    inference_only: true
    weights_updated: false
    velocity_labels_loaded: false

thresholds:
  method: empirical_higher_quantile
  quantile: 0.99
  outer_validation: leave_one_complete_month_out
  calibration: leave_one_complete_month_out_inside_outer_reference_pool
  frozen_values: null

decision:
  pass: no_abnormal_evidence
  warning: one_abnormal_evidence_family
  abstain: at_least_two_abnormal_evidence_families
  mindful_can_abstain_alone: false
  action_on_abstain: pause_decoder_and_request_recalibration_or_review

validation_scope:
  phase3a:
    - intact_held_month_false_alarm_rate
    - synthetic_global_thinning
    - synthetic_channel_dropout
    - synthetic_channel_permutation
    - synthetic_mixed_fault
  phase3b:
    status: complete
    runner: history/phase3/phase3b_leave_one_month_out.py
    protocol:
      - leave_one_complete_pre_january_month_out
      - train_temporary_decoder_on_remaining_months
      - fixed_seed_43_and_epoch_7_without_held_month_selection
      - relate_detector_scores_to_strict_out_of_month_decoder_r2
  phase3c:
    status: complete_and_archived
    runner: history/phase3/phase3c_decoder_state_detector.py
    result: results/indy/phase3c_decoder_state_detector
    promotion_gate:
      - both_known_negative_r2_sessions_abstain
      - all_other_31_sessions_pass
      - result_holds_for_3x3_hidden_dimension_covariance_sensitivity
    final_active_artifact_audit:
      indy_20160630_01: pass
      indy_20161013_03: abstain
      explanation: The retained active checkpoint trained on both sessions; strict outer-fold checkpoints did not.
operational_runtime:
  entrypoint: models/indy_32ch/runtime.py
  order:
    - collect_first_1500_count_bins
    - run_raw_count_detector
    - run_frozen_decoder_state_detector
    - combine_pass_warning_abstain
    - release_only_post_warmup_predictions_when_permitted
  weights_updated: false
  velocity_labels_loaded: false
  artifacts:
    layer1: results/indy/phase3c_decoder_state_detector/phase3c_active_layer1_reference.npz
    layer2: results/indy/phase3c_decoder_state_detector/phase3c_active_layer2_reference.npz
  deferred:
    - prospective_future_session_validation
    - stm32_fixed_point_equivalence
