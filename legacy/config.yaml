# =============================================================================
# Neural Intent Decoder -- central configuration
# =============================================================================
# Every stage reads from this file so the pipeline is reproducible and there
# are no magic numbers buried in the code. Values were chosen from the verified
# ds004022 recording parameters (18-ch EEG @ 500 Hz, NIRx fNIRS @ 7.8125 Hz,
# 4 imagined right-upper-limb actions).

project: neural_intent_decoder
seed: 42

paths:
  bids_root: data/ds004022       # where the OpenNeuro dataset is extracted
  cache_dir: data/cache          # cached epochs / features (.npz)
  results_dir: results
  figures_dir: results/figures
  metrics_dir: results/metrics

# -----------------------------------------------------------------------------
# Dataset / event coding
# -----------------------------------------------------------------------------
# ds004022 has NO events.tsv files. Labels live inside the EEGLAB .set event
# struct (BrainVision markers "S  3".."S  6") and inside the fNIRS BBCI .mat
# marker struct (mrk.toe codes 3..6). Both share the same order, verified from
# the fNIRS mrk.clab names: ['Session Start','Trial Onset','Reach','Grasp',
# 'Lift','Twist','Ready Onset','MI Start Onset','Rest Onset'].
dataset:
  task: motorimagery
  classes: [reach, grasp, lift, twist]   # fixed order -> class ids 0,1,2,3

  # EEG (BrainVision) marker strings. Matching is whitespace-insensitive, so
  # "S  3", "S 3" and "3" all match. Give any aliases you observe with
  #   `python main.py inspect`.
  eeg_class_markers:
    reach: ["S  3", "3"]
    grasp: ["S  4", "4"]
    lift:  ["S  5", "5"]
    twist: ["S  6", "6"]
  eeg_mi_onset_markers: ["S  8", "8"]     # "MI Start Onset" -> imagery begins

  # fNIRS BBCI marker codes (mrk.toe, 1-based into mrk.clab)
  fnirs_class_toe:
    reach: 3
    grasp: 4
    lift:  5
    twist: 6
  fnirs_mi_onset_toe: 8

# -----------------------------------------------------------------------------
# EEG preprocessing + epoching
# -----------------------------------------------------------------------------
eeg:
  l_freq: 1.0          # bandpass low edge (Hz). Broadband here so bandpower can
  h_freq: 40.0         #   read mu+beta and FBCSP can re-filter per band. For a
                       #   pure MI setup you may prefer 8-30 Hz.
  notch: [60, 120]     # line noise + harmonic (Korea University -> 60 Hz)
  car: false           # common average reference (no EOG channels to drop here)
  resample: null       # e.g. 250 to downsample; null keeps 500 Hz
  tmin: 0.0            # epoch start relative to MI-onset marker (s)
  tmax: 5.0            # epoch end   relative to MI-onset marker (s) -> 5 s imagery
  baseline: null       # e.g. [-0.5, 0.0]; null = no baseline correction
  # Anchor epochs on the MI-onset marker when present, else on the class-cue
  # marker plus this offset (fixation 3 s + cue 4 s + ready 3 s = 10 s).
  fallback_onset_offset: 10.0
  reject_uv: null      # peak-to-peak reject threshold in microvolts; null = off
  picks: null          # null = all 18 channels; or a list e.g. [C3, C4, Cz]

# -----------------------------------------------------------------------------
# fNIRS preprocessing + epoching
# -----------------------------------------------------------------------------
# The hemodynamic response is slow (~5-8 s to peak), so we epoch a longer window
# than for EEG and low-pass hard.
fnirs:
  tmin: -2.0           # includes a short pre-onset baseline
  tmax: 15.0
  l_freq: 0.01
  h_freq: 0.2
  ppf: 6.0             # partial pathlength factor for modified Beer-Lambert
  baseline: [-2.0, 0.0]
  source_detector_distance_cm: 3.0

# -----------------------------------------------------------------------------
# Feature extraction
# -----------------------------------------------------------------------------
features:
  eeg_bands:
    mu:   [8, 13]      # sensorimotor mu / alpha
    beta: [13, 30]     # beta
  eeg_window_sec: 1.0        # sub-window length for time-windowed bandpower
  eeg_window_overlap: 0.5    # fraction overlap between sub-windows
  eeg_log_power: true        # log-transform bandpower (stabilises variance)
  fnirs_windows: 3           # split the response into N equal windows
  fnirs_stats: [mean, peak, slope, auc]

# -----------------------------------------------------------------------------
# N1 -- neural evidence decoder (classifier)
# -----------------------------------------------------------------------------
model:
  classifier: lda      # lda | logreg | svm | rf | gb | gelu_nn
  cv_folds: 5          # stratified K-fold for subject-specific evaluation
  # All N1 runs are EEG+fNIRS. The standard path uses EEG bandpower + fNIRS
  # hemodynamic features; `fbcsp` and `riemannian` swap in an EEG front end and
  # still concatenate aligned fNIRS features before classification.
  n1_features: fused_bandpower

# Optional simple neural-network N1 classifier (`--classifier gelu_nn`).
# It is a feature-space MLP: StandardScaler -> Linear -> GELU -> Dropout -> ...
neural_network:
  hidden_layers: [64, 32]
  dropout: 0.10
  lr: 0.001
  weight_decay: 0.001
  batch_size: 32
  epochs: 80
  patience: 10
  validation_fraction: 0.15

# Optional fused temporal CNN (`python main.py temporal-cnn`).
# This is intentionally small and trained from scratch inside every CV fold:
# raw EEG epoch -> temporal/spatial conv branch, fNIRS hemodynamic features ->
# dense branch, concatenate -> classifier. EEG is decimated after preprocessing
# for CPU runtime; the cached EEG is already low-passed at 40 Hz.
temporal_cnn:
  eeg_decimate: 5       # 500 Hz -> 100 Hz effective input rate
  moving_average_window: 1
  temporal_filters: 8
  spatial_multiplier: 2
  separable_filters: 16
  kernel_size: 65       # samples after decimation, approximately 650 ms
  fnirs_hidden: 16
  fusion_hidden: 32
  dropout: 0.30
  lr: 0.001
  weight_decay: 0.01
  batch_size: 16
  epochs: 40
  patience: 8
  validation_fraction: 0.20
  num_threads: 1
  verbose: false

# Same CNN budget, but each EEG channel is lightly causally smoothed before
# decimation: y[t] = mean(x[t-9:t]) at the original 500 Hz epoch rate
# (~20 ms window). Sweep this later if it proves useful.
smoothed_temporal_cnn:
  eeg_decimate: 5
  moving_average_window: 10
  temporal_filters: 8
  spatial_multiplier: 2
  separable_filters: 16
  kernel_size: 65
  fnirs_hidden: 16
  fusion_hidden: 32
  dropout: 0.30
  lr: 0.001
  weight_decay: 0.01
  batch_size: 16
  epochs: 40
  patience: 8
  validation_fraction: 0.20
  num_threads: 1
  verbose: false

# Symbolic ERD/ERS timing features (`python main.py symbolic-erd`).
# This builds EEG epochs from -2..5 s so each trial can normalize post-onset
# mu/beta power against its own pre-onset baseline. It still predicts the four
# action classes only; rest/baseline is not used as a target class.
symbolic_erd:
  eeg_tmin: -2.0
  eeg_tmax: 5.0
  baseline_window: [-2.0, 0.0]
  analysis_window: [0.0, 5.0]
  moving_average_window: 10
  window_sec: 0.5
  window_overlap: 0.5
  filter_order: 4
  bands:
    mu: [8, 13]
    low_beta: [13, 20]
    high_beta: [20, 30]
  erd_threshold: -0.10
  ers_threshold: 0.10
  include_continuous: true
  include_state_onehot: true
  include_state_counts: true
  include_transitions: true

# Optional bare fused SNN (`python main.py snn`).
# Raw EEG provides the time steps; aligned fNIRS features are repeated at each
# time step. Architecture: Linear input current -> LIF hidden layer -> Linear
# readout. No convolutional front end.
snn:
  eeg_decimate: 5       # start from the same 100 Hz EEG stream as temporal_cnn
  time_bins: 128        # average bins across the 5 s epoch for faster unrolling
  hidden_size: 64
  beta: 0.90
  threshold: 1.0
  surrogate_slope: 25.0
  dropout: 0.10
  lr: 0.001
  weight_decay: 0.01
  batch_size: 16
  epochs: 40
  patience: 8
  validation_fraction: 0.20
  num_threads: 1
  verbose: false

# Static Riemannian tangent-space features -> repeated-current SNN.
# EEG tangent-space and fNIRS features are concatenated, scaled inside the SNN
# classifier, then repeated across `time_steps`.
riemannian_snn:
  time_steps: 32
  hidden_size: 64
  beta: 0.90
  threshold: 1.0
  surrogate_slope: 25.0
  dropout: 0.10
  lr: 0.001
  weight_decay: 0.01
  batch_size: 16
  epochs: 40
  patience: 8
  validation_fraction: 0.20
  num_threads: 1
  verbose: false

# Windowed Riemannian tangent-space sequence -> SNN.
# The reference covariance is fit from training-fold windows only.
windowed_riemannian_snn:
  l_freq: 8.0
  h_freq: 30.0
  reg: 0.001
  eps: 1.0e-7
  filter_order: 4
  window_sec: 1.0
  window_overlap: 0.5
  hidden_size: 64
  beta: 0.90
  threshold: 1.0
  surrogate_slope: 25.0
  dropout: 0.10
  lr: 0.001
  weight_decay: 0.01
  batch_size: 16
  epochs: 40
  patience: 8
  validation_fraction: 0.20
  num_threads: 1
  verbose: false

# -----------------------------------------------------------------------------
# Window sweep (find the best analysis window per modality)
# -----------------------------------------------------------------------------
# Windows are [start, end] seconds relative to imagery onset. EEG stays within
# the 5 s imagery period; fNIRS windows are shifted/longer for the ~5 s
# hemodynamic lag.
sweep:
  eeg_windows:   [[0.0, 5.0], [0.5, 4.5], [0.0, 4.0], [1.0, 5.0], [2.0, 5.0]]
  fnirs_windows: [[0.0, 10.0], [2.0, 7.0], [3.0, 8.0], [4.0, 10.0], [5.0, 12.0]]

# -----------------------------------------------------------------------------
# FBCSP -- EEG front end fused with fNIRS features
# -----------------------------------------------------------------------------
fbcsp:
  bands: [[8, 12], [12, 16], [16, 20], [20, 24], [24, 30]]  # filter bank (Hz)
  # Capacity knobs -- the classical-ML analog of "fewer layers". Lower = less
  # overfitting on small per-subject data. Raise only when held-out-run scores
  # justify the extra capacity.
  n_components: 1      # CSP pairs per one-vs-rest class (-> 2*n filters/band/class)
  n_select: 12         # top features kept by mutual-information selection
  reg: 1.0e-5          # covariance regularisation (numerical stability)
  filter_order: 4      # Butterworth order per band

# -----------------------------------------------------------------------------
# Riemannian tangent-space EEG front end fused with fNIRS features
# -----------------------------------------------------------------------------
riemannian:
  l_freq: 8.0          # MI band before covariance; null disables the edge
  h_freq: 30.0
  reg: 0.001           # covariance shrinkage toward identity / n_channels
  eps: 1.0e-7          # eigenvalue floor for SPD matrix logs
  filter_order: 4

# -----------------------------------------------------------------------------
# N2 -- state-injected intent-to-command interpreter
# -----------------------------------------------------------------------------
n2:
  confidence_threshold: 0.50   # min top-1 probability to act
  margin_threshold: 0.15       # min gap between top-1 and top-2 probability
  smoothing_window: 5          # majority vote / smoothing over recent steps
  smoothing_min_agreement: 3   # votes required within the window to commit
  wrist_limit_deg: 90          # safe rotation limit for TWIST
  wrist_step_deg: 30           # rotation applied per accepted TWIST
  arm_extend_step: 1           # discrete arm-extension increment
  arm_raise_step: 1            # discrete arm-raise increment

# -----------------------------------------------------------------------------
# Time-domain replay / demo
# -----------------------------------------------------------------------------
replay:
  windows_per_trial: 5   # slide N windows across each trial to feel "online"
  step_seconds: 0.5      # spacing between successive N1 inferences (display)
  animate: false         # true -> matplotlib animation; false -> CLI table
