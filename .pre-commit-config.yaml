# Archived experiments are immutable provenance and are intentionally excluded
# from mechanical cleanup. Active code, configuration, and documentation remain
# checked on every commit.
exclude: ^((finger_movements|indy_loco)/history/|(finger_movements|indy_loco)/data/raw/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest guardrails
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
